- hosts: all
  strategy: free
  gather_facts: yes
  become: "{{ ANSIBLE_BECOME }}"
  ignore_errors: "{{ IGNORE_ERRORS }}"
  pre_tasks:
    - name: Load user-supplied ansible variables
      include_vars: "{{ ansible_variables }}"
      when: ansible_variables is defined
      ignore_errors: false
  tasks:
    - include_tasks: "{{ post_configure_source }}"