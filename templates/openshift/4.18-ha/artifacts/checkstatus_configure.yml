- name: Check status until it is COMPLETED
  command: cat /home/ubuntu/openshift/status
  register: file_content
  until: file_content.stdout == "COMPLETED"
  retries: 72  # ~13 min wall time incl. SSH overhead; must stay under 900s limit
  delay: 10
  ignore_errors: true
- debug:
    msg: OpenShift installation COMPLETED. All cluster operators are up and running.
  when: file_content.stdout == "COMPLETED"
- name: Read status detail
  command: cat /home/ubuntu/openshift/status.detail
  register: status_detail
  failed_when: false
  changed_when: false
  when: file_content.stdout != "COMPLETED"
- name: Check status failed
  fail:
    msg: |
      OpenShift installation not completed after checking status. Last status: {{ file_content.stdout }}.
      Read our document on how to troubleshoot the issue.
      --- status.detail ---
      {{ status_detail.stdout | default('') }}
  when: file_content.stdout != "COMPLETED"
